<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Startup & Social Media Dashboard</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #3b82f6;
      --text: #f8fafc;
      --subtext: #94a3b8;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 800px;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
    }

    h1 {
      margin: 0 0 10px 0;
      color: #ffffff;
    }

    p {
      color: var(--subtext);
      margin: 0;
    }

    .card {
      background: var(--card);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-weight: 600;
      font-size: 0.9rem;
    }

    input, select, textarea {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #334155;
      background-color: #0f172a;
      color: var(--text);
      box-sizing: border-box;
      font-size: 1rem;
    }

    button {
      background-color: var(--accent);
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      width: 100%;
      font-size: 1rem;
      transition: background 0.2s;
    }

    button:hover {
      background-color: #2563eb;
    }

    .results {
      margin-top: 20px;
    }

    .item {
      background-color: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 15px;
      margin-bottom: 10px;
    }

    .item h3 {
      margin: 0 0 5px 0;
      color: var(--accent);
    }

    .item p {
      color: var(--text);
      font-size: 0.95rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>AI Startup & Social Generator</h1>
      <p>Scrape leads & generate business strategy from one interface</p>
    </header>

    <div class="card">
      <h2>1. Startup Finder</h2>
      <div class="form-group">
        <label for="industry">Industry / Niche</label>
        <input type="text" id="industry" placeholder="e.g. AI SaaS, FinTech, E-commerce">
      </div>
      <button onclick="fetchStartups()">Fetch Startups</button>
    </div>

    <div class="card">
      <h2>2. Social Media Business Generator</h2>
      <div class="form-group">
        <label for="businessName">Business Name / Idea</label>
        <input type="text" id="businessName" placeholder="e.g. EcoPack Solutions">
      </div>
      <div class="form-group">
        <label for="platform">Target Platform</label>
        <select id="platform">
          <option value="Instagram">Instagram</option>
          <option value="TikTok">TikTok</option>
          <option value="LinkedIn">LinkedIn</option>
          <option value="Twitter/X">Twitter/X</option>
        </select>
      </div>
      <button onclick="generateSocialContent()">Generate Campaign</button>
    </div>

    <div class="card">
      <h2>Output Results</h2>
      <div id="output" class="results">
        <p>Results will appear here...</p>
      </div>
    </div>
  </div>

  <script>
    function fetchStartups() {
      const industry = document.getElementById('industry').value || 'Tech';
      const output = document.getElementById('output');
      
      output.innerHTML = '<p>Searching for trending startups in ' + industry + '...</p>';
      
      setTimeout(() => {
        output.innerHTML = `
          <div class="item">
            <h3>Alpha AI (${industry})</h3>
            <p>Automates customer support workflows using LLMs. Founded 2026.</p>
          </div>
          <div class="item">
            <h3>Beta Scale (${industry})</h3>
            <p>B2B lead generation tool scraping public directory data.</p>
          </div>
        `;
      }, 1000);
    }

    function generateSocialContent() {
      const name = document.getElementById('businessName').value || 'My Business';
      const platform = document.getElementById('platform').value;
      const output = document.getElementById('output');
      
      output.innerHTML = '<p>Generating ' + platform + ' content strategy...</p>';
      
      setTimeout(() => {
        output.innerHTML = `
          <div class="item">
            <h3>${platform} Campaign Strategy for ${name}</h3>
            <p><strong>Hook:</strong> "How we scaled ${name} without paid ads."</p>
            <p><strong>Content Plan:</strong> 3x Weekly shorts showing product demo + founder story.</p>
            <p><strong>Call to Action:</strong> Link in bio for free beta access.</p>
          </div>
        `;
      }, 1000);
    }
  </script>

</body>
</html>
